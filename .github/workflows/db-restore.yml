name: Database Restore

on:
  # Manual trigger only — restoring always requires explicit human action
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to restore'
        required: true
        type: choice
        options:
          - production
          - testing
      filename:
        description: 'Backup filename to restore (e.g. digipulse_prod_2026-05-06_03-00-00.dump)'
        required: true
      confirm:
        description: 'Type "yes" to confirm — ALL existing data will be replaced!'
        required: true
        default: ''

jobs:
  export-matrix:
    name: Export deployment matrix
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENT_MATRIX: ${{ steps.filter.outputs.DEPLOYMENT_MATRIX }}
    steps:
      - uses: actions/checkout@v6
      - name: Export deployment matrix
        id: export
        uses: ./.github/actions/export-deploy-matrix
        with:
          deployment_matrix: ${{ vars.DEPLOYMENT_MATRIX }}
      - name: Filter by environment
        id: filter
        env:
          FILTER_ENV: ${{ github.event.inputs.environment }}
          FULL_MATRIX: ${{ steps.export.outputs.DEPLOYMENT_MATRIX }}
        run: |
          FILTERED=$(echo "$FULL_MATRIX" | jq --arg env "$FILTER_ENV" '[.[] | select(.environment == $env)]')
          if [ "$(echo "$FILTERED" | jq 'length')" -eq 0 ]; then
            echo "No server found for environment: $FILTER_ENV"
            exit 1
          fi
          delimiter="$(openssl rand -hex 8)"
          {
            echo "DEPLOYMENT_MATRIX<<${delimiter}"
            echo "$FILTERED"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  restore:
    name: "${{ matrix.server.name }}: Restore PostgreSQL from backup"
    runs-on: ubuntu-latest
    needs: export-matrix
    environment: ${{ matrix.server.environment }}
    strategy:
      matrix:
        server: ${{ fromJson(needs.export-matrix.outputs.DEPLOYMENT_MATRIX) }}

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "❌ Confirmation not received. Type 'yes' in the confirm field."
            exit 1
          fi

      - name: Run restore on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          script: |
            set -euo pipefail

            CONTAINER_PREFIX="${{ matrix.server.container_prefix || 'digipulse' }}"
            DB_CONTAINER="${CONTAINER_PREFIX}-db"
            DB_NAME="${{ vars.DB_DATABASE }}"
            DB_USER="${{ vars.DB_USERNAME }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

            ENV="${{ matrix.server.environment }}"
            if [ "$ENV" = "production" ]; then LABEL="prod"; else LABEL="test"; fi

            HETZNER_USER="${{ vars.HETZNER_USER }}"
            HETZNER_HOST="${HETZNER_USER}.your-storagebox.de"
            HETZNER_PORT=23
            HETZNER_DIR="digipulse/backups/postgres/${LABEL}"

            LOCAL_DIR="$HOME/backups/${LABEL}"
            FILENAME="${{ github.event.inputs.filename }}"

            if [[ ! "$FILENAME" =~ ^digipulse_(prod|test)_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}\.dump$ ]]; then
              echo "❌ Invalid filename format. Expected: digipulse_prod_YYYY-MM-DD_HH-MM-SS.dump"
              exit 1
            fi

            TEMP_FILE="${LOCAL_DIR}/restore_temp.dump"
            mkdir -p "$LOCAL_DIR"

            echo "→ Downloading ${FILENAME} from Hetzner..."
            rsync -av --progress \
              -e "ssh -p ${HETZNER_PORT} -o StrictHostKeyChecking=no -o BatchMode=yes" \
              "${HETZNER_USER}@${HETZNER_HOST}:${HETZNER_DIR}/${FILENAME}" \
              "${TEMP_FILE}"
            echo "✓ Downloaded: $(du -sh ${TEMP_FILE} | cut -f1)"

            EMERGENCY="${LOCAL_DIR}/pre_restore_$(date +%Y-%m-%d_%H-%M-%S).dump"
            echo "→ Creating emergency dump → ${EMERGENCY}"
            docker exec -e PGPASSWORD="$DB_PASSWORD" "$DB_CONTAINER" pg_dump \
              -U "$DB_USER" -d "$DB_NAME" \
              --format=custom > "$EMERGENCY" || echo "⚠ Emergency dump failed — continuing anyway"
            echo "✓ Emergency dump: $(du -sh ${EMERGENCY} | cut -f1)"

            APP_CONTAINER="${CONTAINER_PREFIX}-app"
            MONITOR_CONTAINER="${CONTAINER_PREFIX}-monitor"

            echo "→ Stopping application containers..."
            docker stop "$APP_CONTAINER" "$MONITOR_CONTAINER" || true

            echo "→ Terminating active DB connections..."
            docker exec -e PGPASSWORD="$DB_PASSWORD" "$DB_CONTAINER" psql -U "$DB_USER" -d postgres -c \
              "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${DB_NAME}' AND pid <> pg_backend_pid();" || true

            echo "→ Dropping and recreating database..."
            docker exec -e PGPASSWORD="$DB_PASSWORD" "$DB_CONTAINER" psql -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS ${DB_NAME};"
            docker exec -e PGPASSWORD="$DB_PASSWORD" "$DB_CONTAINER" psql -U "$DB_USER" -d postgres -c "CREATE DATABASE ${DB_NAME} OWNER ${DB_USER};"

            echo "→ Restoring from ${FILENAME}..."
            RESTORE_START=$(date +%s)
            docker exec -i -e PGPASSWORD="$DB_PASSWORD" "$DB_CONTAINER" pg_restore \
              -U "$DB_USER" -d "$DB_NAME" \
              --no-owner --no-acl -v \
              < "$TEMP_FILE"
            RESTORE_END=$(date +%s)
            echo "✓ Restore complete in $((RESTORE_END - RESTORE_START))s"

            echo "→ Starting application containers..."
            docker start "$APP_CONTAINER" "$MONITOR_CONTAINER" || true

            echo "→ Running migrations..."
            docker exec "$APP_CONTAINER" php artisan migrate --force \
              && echo "✓ Migrations done" \
              || echo "⚠ Migrations skipped"

            echo "→ Clearing cache/config..."
            docker exec "$APP_CONTAINER" php artisan cache:clear || echo "⚠ cache:clear skipped"
            docker exec "$APP_CONTAINER" php artisan config:clear || echo "⚠ config:clear skipped"

            rm -f "$TEMP_FILE"

            echo ""
            echo "✅ Restore complete!"
            echo "  Server: ${{ matrix.server.name }}"
            echo "  Restored from: ${FILENAME}"
            echo "  Emergency dump: ${EMERGENCY}"
            echo "  Triggered by: ${{ github.actor }}"

      - name: List backups on Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ matrix.server.port }}
          script: |
            ENV="${{ matrix.server.environment }}"
            if [ "$ENV" = "production" ]; then LABEL="prod"; else LABEL="test"; fi
            echo "Available ${LABEL} backups on Hetzner:"
            ssh -p 23 -o StrictHostKeyChecking=no -o BatchMode=yes \
              "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_USER }}.your-storagebox.de" \
              "ls -lht digipulse/backups/postgres/${LABEL}/digipulse_${LABEL}_*.dump 2>/dev/null | awk '{print \$5, \$9}' | sed \"s|digipulse/backups/postgres/${LABEL}/||\"" \
              || echo "(no backups found)"