name: API Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - testing

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  export-matrix:
    name: Export deployment matrix
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENT_MATRIX: ${{ steps.filter.outputs.DEPLOYMENT_MATRIX }}
    steps:
      - uses: actions/checkout@v6
      - name: Export deployment matrix
        id: export
        uses: ./.github/actions/export-deploy-matrix
        with:
          deployment_matrix: ${{ vars.DEPLOYMENT_MATRIX }}
      - name: Filter by environment
        id: filter
        env:
          FILTER_ENV: ${{ github.event.inputs.environment || 'all' }}
          FULL_MATRIX: ${{ steps.export.outputs.DEPLOYMENT_MATRIX }}
        run: |
          if [ "$FILTER_ENV" = "all" ]; then
            FILTERED="$FULL_MATRIX"
          else
            FILTERED=$(echo "$FULL_MATRIX" | jq --arg env "$FILTER_ENV" '[.[] | select(.environment == $env)]')
          fi
          delimiter="$(openssl rand -hex 8)"
          {
            echo "DEPLOYMENT_MATRIX<<${delimiter}"
            echo "$FILTERED"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  health:
    name: "${{ matrix.server.name }}: API Health Check"
    runs-on: ubuntu-latest
    needs: export-matrix
    environment: ${{ matrix.server.environment }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.export-matrix.outputs.DEPLOYMENT_MATRIX) }}
    steps:
      - name: Check API health
        id: check
        env:
          FRONTEND_KEY: ${{ secrets.FRONTEND_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          HEALTH_URL="${APP_URL%/}/api/v1/health"
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -H "X-Frontend-Key: ${FRONTEND_KEY}" \
            "${HEALTH_URL}")
          echo "status=$response" >> $GITHUB_OUTPUT
          echo "url=${HEALTH_URL}" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ]; then
            echo "API is down or degraded! HTTP status: $response"
            exit 1
          fi

      - name: Notify via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d "text=🔴 <b>${{ matrix.server.name }} API is down!</b>%0A%0AHTTP status: ${{ steps.check.outputs.status }}%0A${APP_URL%/}/api/v1/health"